name: Multi-platform build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.jenkins_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - jenkins_label: precise
            runner: ubuntu-22.04
          - jenkins_label: trusty
            runner: ubuntu-24.04
          - jenkins_label: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build on Unix
        if: runner.os != 'Windows'
        run: make

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      - name: Test on Unix
        if: runner.os != 'Windows'
        run: make test

      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: test.bat

      # actions/upload-artifact v7.0.1
      - name: Archive build output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ matrix.jenkins_label }}
          path: build/**
          if-no-files-found: warn
          retention-days: 5
