# Migrated from: complexdeployment/Jenkinsfile (declarative pipeline)
# Original source: custom comprehensive example.
name: Complex Deployment

on:
  # Jenkins had no triggers block; the pipeline was started manually with parameters.
  workflow_dispatch:
    inputs:
      DEPLOYMENT_TARGET:
        description: Target environment for deployment
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev
      ROLLBACK_ON_FAILURE:
        description: Automatically rollback on deployment failure
        type: boolean
        default: true
      CUSTOM_TAG:
        description: Custom Docker tag (leave empty for auto-generated)
        type: string
        default: ''

# Jenkins deployments were serialized per environment by the Jenkins job queue.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.DEPLOYMENT_TARGET }}
  cancel-in-progress: false

permissions:
  contents: read

# Jenkins: environment { ... }
env:
  APP_NAME: microservice-app
  DOCKER_REGISTRY: registry.example.com
  HELM_CHART: microservice-chart
  SLACK_CHANNEL: '#deployments'

jobs:
  # Jenkins stage 'Preparation'
  preparation:
    name: Preparation
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.vars.outputs.build_tag }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute build variables
        id: vars
        env:
          CUSTOM_TAG: ${{ inputs.CUSTOM_TAG }}
          DEPLOYMENT_TARGET: ${{ inputs.DEPLOYMENT_TARGET }}
        run: |
          set -euo pipefail
          git_commit_short="$(git rev-parse --short HEAD)"
          # Jenkins: params.CUSTOM_TAG ?: "${GIT_COMMIT_SHORT}-${BUILD_NUMBER}"
          build_tag="${CUSTOM_TAG:-${git_commit_short}-${GITHUB_RUN_NUMBER}}"
          image_tag="${DOCKER_REGISTRY}/${APP_NAME}:${build_tag}"
          echo "build_tag=${build_tag}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          # Jenkins: currentBuild.description
          echo "Deploying ${build_tag} to ${DEPLOYMENT_TARGET}" >> "$GITHUB_STEP_SUMMARY"
          echo "🚀 Starting deployment pipeline"
          echo "📦 Image tag: ${image_tag}"
          echo "🎯 Target: ${DEPLOYMENT_TARGET}"

  # Jenkins stage 'Build & Test' -> parallel stage 'Unit Tests'
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: preparation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn clean test

      # Jenkins: publishTestResults / publishCoverage (jacoco)
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/surefire-reports/*.xml
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: warn

  # Jenkins stage 'Build & Test' -> parallel stage 'Security Scan'
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: preparation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OWASP dependency-check
        run: dependency-check --project "${APP_NAME}" --scan . --format XML

      # Jenkins: publishHTML(['Security Scan Report'])
      - name: Upload security scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-report
          path: target/dependency-check-report.*
          if-no-files-found: error

  # Jenkins stage 'Build & Test' -> parallel stage 'Code Quality'
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: preparation
    # Jenkins: timeout(time: 10, unit: 'MINUTES') around waitForQualityGate()
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Jenkins: withSonarQubeEnv('SonarQube') { mvn sonar:sonar } + waitForQualityGate()
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: -Dsonar.projectKey=${{ env.APP_NAME }} -Dsonar.qualitygate.wait=true

  # Jenkins stage 'Build Docker Image'
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - preparation
      - unit-tests
      - security-scan
      - code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package application
        run: mvn package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Jenkins: docker.withRegistry(..., 'docker-registry-credentials')
      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      # Jenkins: docker.build(...) ; image.push() ; image.push('latest')
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ needs.preparation.outputs.image_tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.APP_NAME }}:latest

      # Jenkins: trivy image --exit-code 0 --severity HIGH,CRITICAL
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ needs.preparation.outputs.image_tag }}
          severity: HIGH,CRITICAL
          exit-code: '0'

  # Jenkins stage 'Deploy' (including the try/catch rollback logic)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - preparation
      - build-image
    environment: ${{ inputs.DEPLOYMENT_TARGET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy with Helm (rollback on failure)
        env:
          DEPLOYMENT_TARGET: ${{ inputs.DEPLOYMENT_TARGET }}
          ROLLBACK_ON_FAILURE: ${{ inputs.ROLLBACK_ON_FAILURE }}
          BUILD_TAG: ${{ needs.preparation.outputs.build_tag }}
        run: |
          set -uo pipefail
          previous_release="$(helm list -n "${DEPLOYMENT_TARGET}" -o json \
            | jq -r --arg name "${APP_NAME}" '.[] | select(.name==$name) | .app_version' || true)"
          previous_release="${previous_release:-none}"
          echo "📋 Previous release: ${previous_release}"

          if helm upgrade --install "${APP_NAME}" "${HELM_CHART}" \
                --namespace "${DEPLOYMENT_TARGET}" \
                --set image.repository="${DOCKER_REGISTRY}/${APP_NAME}" \
                --set image.tag="${BUILD_TAG}" \
                --set environment="${DEPLOYMENT_TARGET}" \
                --wait --timeout=10m \
             && kubectl wait --for=condition=available --timeout=300s \
                "deployment/${APP_NAME}" -n "${DEPLOYMENT_TARGET}"; then
            echo "✅ Deployment succeeded"
            exit 0
          fi

          if [ "${ROLLBACK_ON_FAILURE}" = "true" ] && [ "${previous_release}" != "none" ]; then
            echo "🔄 Deployment failed, initiating rollback to ${previous_release}"
            helm rollback "${APP_NAME}" 0 -n "${DEPLOYMENT_TARGET}"
            kubectl wait --for=condition=available --timeout=300s \
              "deployment/${APP_NAME}" -n "${DEPLOYMENT_TARGET}"
            echo "❌ Deployment failed and rolled back to previous version"
          else
            echo "❌ Deployment failed"
          fi
          exit 1

  # Jenkins stage 'Health Check'
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      # Jenkins: retry(5) { sleep 10; curl -f ... }
      - name: Check health endpoint
        env:
          DEPLOYMENT_TARGET: ${{ inputs.DEPLOYMENT_TARGET }}
        run: |
          set -uo pipefail
          health_endpoint="https://${DEPLOYMENT_TARGET}.example.com/health"
          for attempt in 1 2 3 4 5; do
            sleep 10
            if curl -f "${health_endpoint}"; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt ${attempt} failed"
          done
          exit 1

  # Jenkins stage 'Integration Tests' (when: not production)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: health-check
    if: ${{ inputs.DEPLOYMENT_TARGET != 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run integration tests
        env:
          DEPLOYMENT_TARGET: ${{ inputs.DEPLOYMENT_TARGET }}
        run: |
          mvn failsafe:integration-test \
            -Dtest.endpoint="https://${DEPLOYMENT_TARGET}.example.com" \
            -Dtest.environment="${DEPLOYMENT_TARGET}"

      # Jenkins: publishTestResults testResultsPattern: '**/failsafe-reports/*.xml'
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-reports
          path: '**/failsafe-reports/*.xml'
          if-no-files-found: warn

  # Jenkins stage 'Production Approval' (input step)
  # The Jenkins `input` step is replaced by a GitHub Environment with required
  # reviewers: the job pauses until an approver accepts the deployment.
  production-approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: health-check
    if: ${{ inputs.DEPLOYMENT_TARGET == 'production' }}
    environment: production-approval
    # Jenkins: timeout(time: 30, unit: 'MINUTES')
    timeout-minutes: 30
    steps:
      - name: Record approval
        run: |
          echo "✅ Production deployment approved by: ${GITHUB_ACTOR}"

  # Jenkins stage 'Smoke Tests' (parallel API / UI / Performance tests)
  smoke-tests:
    name: Smoke Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - health-check
      - integration-tests
      - production-approval
    if: >-
      ${{ always()
      && needs.health-check.result == 'success'
      && needs.integration-tests.result != 'failure'
      && needs.production-approval.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API Tests
            kind: api
          - name: UI Tests
            kind: ui
          - name: Performance Tests
            kind: performance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ${{ matrix.name }}
        env:
          DEPLOYMENT_TARGET: ${{ inputs.DEPLOYMENT_TARGET }}
          SMOKE_TEST_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          case "${SMOKE_TEST_KIND}" in
            api)
              newman run postman-collection.json --environment "${DEPLOYMENT_TARGET}.json"
              ;;
            ui)
              cypress run --config baseUrl="https://${DEPLOYMENT_TARGET}.example.com"
              ;;
            performance)
              artillery run performance-test.yml --target "https://${DEPLOYMENT_TARGET}.example.com"
              ;;
          esac

  # Jenkins: post { success / failure / always }
  post:
    name: Post Actions
    runs-on: ubuntu-latest
    needs:
      - preparation
      - unit-tests
      - security-scan
      - code-quality
      - build-image
      - deploy
      - health-check
      - integration-tests
      - production-approval
      - smoke-tests
    if: always()
    steps:
      # Jenkins: post { always { archiveArtifacts 'target/*.jar,**/reports/**' } }
      - name: Download job artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: collected-artifacts
        continue-on-error: true

      - name: Archive collected artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: collected-artifacts
          if-no-files-found: ignore

      # Jenkins: post { success { slackSend(...) } }
      - name: Notify Slack (success)
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_CHANNEL }}"
            text: |
              ✅ *Deployment Successful*
              📦 *Application:* ${{ env.APP_NAME }}
              🏷️ *Version:* ${{ needs.preparation.outputs.build_tag }}
              🎯 *Environment:* ${{ inputs.DEPLOYMENT_TARGET }}
              👤 *Triggered by:* ${{ github.actor }}
              🔗 *Build:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Jenkins: post { failure { slackSend(...) } }
      - name: Notify Slack (failure)
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_CHANNEL }}"
            text: |
              ❌ *Deployment Failed*
              📦 *Application:* ${{ env.APP_NAME }}
              🏷️ *Version:* ${{ needs.preparation.outputs.build_tag }}
              🎯 *Environment:* ${{ inputs.DEPLOYMENT_TARGET }}
              🔄 *Rollback on failure:* ${{ inputs.ROLLBACK_ON_FAILURE }}
              🔗 *Build:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
